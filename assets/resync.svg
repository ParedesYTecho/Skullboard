<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="496" viewBox="0 0 1100 496" role="img" aria-labelledby="resync-title resync-desc"><title id="resync-title">Qué hace /resync</title><desc id="resync-desc">Diagrama de flujo de /resync: toma el lock del servidor, recorre el canal de destacados, agrupa las copias por mensaje original y conserva la más reciente; si el original ya no existe borra las copias y el registro, y si existe corrige el recuento.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#9a968d"/></marker><marker id="arrow-acc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#f2b62a"/></marker></defs><rect width="1100" height="496" fill="#101113"/>
