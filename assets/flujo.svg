<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="264" viewBox="0 0 1100 264" role="img" aria-labelledby="flujo-title flujo-desc"><title id="flujo-title">Flujo de una reacción</title><desc id="flujo-desc">Seis etapas desde una reacción con calavera hasta la publicación del mensaje destacado; el debounce y el lock evitan trabajo duplicado cuando llega una ráfaga.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#8a8a99"/></marker><marker id="arrow-acc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#c9caff"/></marker></defs><rect width="1100" height="264" fill="#0b0b0e"/>
