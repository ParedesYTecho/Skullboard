<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="250" viewBox="0 0 1100 250" role="img" aria-labelledby="t d"><title id="t">Flujo de una reacción</title><desc id="d">Seis etapas desde una reacción con calavera hasta la publicación del mensaje destacado.</desc><rect width="1100" height="250" fill="#0b0b0e"/><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#7d7d8a"/></marker></defs><rect x="32" y="48" width="152" height="170" rx="14" fill="#131318" stroke="#26262f" stroke-width="1.5"/><text x="50" y="40" font-family="'JetBrains Mono','SF Mono',Consolas,monospace" font-size="13" font-weight="500" fill="#7d7d8a" text-anchor="start" letter-spacing="1">01</text><text x="50" y="86" font-family="Inter,'Segoe UI',Helvetica,Arial,sans-serif" font-size="18" font-weight="600" fill="#f2f2f5" text-anchor="start" letter-spacing="0">Reacción</text><text x="50" y="118" font-family="Inter,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" font-weight="400" fill="#b8b8c3" text-anchor="start" letter-spacing="0">Alguien añade o</text><text x="50" y="139" font-family="Inter,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" font-weight="400" fill="#b8b8c3" text-anchor="start" letter-spacing="0">quita una calavera</text><path d="M186 133 L204 133" stroke="#7d7d8a" stroke-width="1.6" fill="none" marker-end="url(#ah)"/><rect x="206" y="48" width="152" height="170" rx="14" fill="#131318" stroke="#26262f" stroke-width="1.5"/><text x="224" y="40" font-family="'JetBrains Mono','SF Mono',Consolas,monospace" font-size="13" font-weight="500" fill="#7d7d8a" text-anchor="start" letter-spacing="1">02</text><text x="224" y="86" font-family="Inter,'Segoe UI',Helvetica,Arial,sans-serif" font-size="18" font-weight="600" fill="#f2f2f5" text-anchor="start" letter-spacing="0">Evento raw</text><text x="224" y="118" font-family="Inter,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" font-weight="400" fill="#b8b8c3" text-anchor="start" letter-spacing="0">Eventos raw de</text><text x="224" y="139" font-family="Inter,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" font-weight="400" fill="#b8b8c3" text-anchor="start" letter-spacing="0">Discord, sin</text><text x="224" y="160" font-family="Inter,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" font-weight="400" fill="#b8b8c3" text-anchor="start" letter-spacing="0">depender de la</text><text x="224" y="181" font-family="Inter,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" font-weight="400" fill="#b8b8c3" text-anchor="start" letter-spacing="0">caché</text><path d="M360 133 L378 133" stroke="#7d7d8a" stroke-width="1.6" fill="none" marker-end="url(#ah)"/><rect x="380" y="48" width="152" height="170" rx="14" fill="#131318" stroke="#c9caff" stroke-width="1.5"/><text x="398" y="40" font-family="'JetBrains Mono','SF Mono',Consolas,monospace" font-size="13" font-weight="500" fill="#c9caff" text-anchor="start" letter-spacing="1">03</text><text x="398" y="86" font-family="Inter,'Segoe UI',Helvetica,Arial,sans-serif" font-size="18" font-weight="600" fill="#f2f2f5" text-anchor="start" letter-spacing="0">Debounce</text><text x="398" y="118" font-family="Inter,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" font-weight="400" fill="#b8b8c3" text-anchor="start" letter-spacing="0">Espera 2 s y</text><text x="398" y="139" font-family="Inter,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" font-weight="400" fill="#b8b8c3" text-anchor="start" letter-spacing="0">reinicia el</text><text x="398" y="160" font-family="Inter,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" font-weight="400" fill="#b8b8c3" text-anchor="start" letter-spacing="0">temporizador por</text><text x="398" y="181" font-family="Inter,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" font-weight="400" fill="#b8b8c3" text-anchor="start" letter-spacing="0">mensaje</text><path d="M534 133 L552 133" stroke="#7d7d8a" stroke-width="1.6" fill="none" marker-end="url(#ah)"/><rect x="554" y="48" width="152" height="170" rx="14" fill="#131318" stroke="#c9caff" stroke-width="1.5"/><text x="572" y="40" font-family="'JetBrains Mono','SF Mono',Consolas,monospace" font-size="13" font-weight="500" fill="#c9caff" text-anchor="start" letter-spacing="1">04</text><text x="572" y="86" font-family="Inter,'Segoe UI',Helvetica,Arial,sans-serif" font-size="18" font-weight="600" fill="#f2f2f5" text-anchor="start" letter-spacing="0">Lock</text><text x="572" y="118" font-family="Inter,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" font-weight="400" fill="#b8b8c3" text-anchor="start" letter-spacing="0">Un solo proceso a</text><text x="572" y="139" font-family="Inter,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" font-weight="400" fill="#b8b8c3" text-anchor="start" letter-spacing="0">la vez sobre ese</text><text x="572" y="160" font-family="Inter,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" font-weight="400" fill="#b8b8c3" text-anchor="start" letter-spacing="0">mensaje</text><path d="M708 133 L726 133" stroke="#7d7d8a" stroke-width="1.6" fill="none" marker-end="url(#ah)"/><rect x="728" y="48" width="152" height="170" rx="14" fill="#131318" stroke="#26262f" stroke-width="1.5"/><text x="746" y="40" font-family="'JetBrains Mono','SF Mono',Consolas,monospace" font-size="13" font-weight="500" fill="#7d7d8a" text-anchor="start" letter-spacing="1">05</text><text x="746" y="86" font-family="Inter,'Segoe UI',Helvetica,Arial,sans-serif" font-size="18" font-weight="600" fill="#f2f2f5" text-anchor="start" letter-spacing="0">Recuento</text><text x="746" y="118" font-family="Inter,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" font-weight="400" fill="#b8b8c3" text-anchor="start" letter-spacing="0">Cuenta real de</text><text x="746" y="139" font-family="Inter,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" font-weight="400" fill="#b8b8c3" text-anchor="start" letter-spacing="0">calaveras y</text><text x="746" y="160" font-family="Inter,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" font-weight="400" fill="#b8b8c3" text-anchor="start" letter-spacing="0">comparación con el</text><text x="746" y="181" font-family="Inter,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" font-weight="400" fill="#b8b8c3" text-anchor="start" letter-spacing="0">umbral</text><path d="M882 133 L900 133" stroke="#7d7d8a" stroke-width="1.6" fill="none" marker-end="url(#ah)"/><rect x="902" y="48" width="152" height="170" rx="14" fill="#131318" stroke="#26262f" stroke-width="1.5"/><text x="920" y="40" font-family="'JetBrains Mono','SF Mono',Consolas,monospace" font-size="13" font-weight="500" fill="#7d7d8a" text-anchor="start" letter-spacing="1">06</text><text x="920" y="86" font-family="Inter,'Segoe UI',Helvetica,Arial,sans-serif" font-size="18" font-weight="600" fill="#f2f2f5" text-anchor="start" letter-spacing="0">Publicar</text><text x="920" y="118" font-family="Inter,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" font-weight="400" fill="#b8b8c3" text-anchor="start" letter-spacing="0">Crea o edita el</text><text x="920" y="139" font-family="Inter,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" font-weight="400" fill="#b8b8c3" text-anchor="start" letter-spacing="0">mensaje destacado</text><text x="920" y="160" font-family="Inter,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" font-weight="400" fill="#b8b8c3" text-anchor="start" letter-spacing="0">y guarda el estado</text><text x="32" y="242" font-family="Inter,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#7d7d8a" text-anchor="start" letter-spacing="0">Las etapas 03 y 04 evitan trabajo duplicado cuando una ráfaga de reacciones llega al mismo mensaje.</text></svg>
