<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="768" viewBox="0 0 1100 768" role="img" aria-labelledby="login-title login-desc"><title id="login-title">Inicio de sesión del dashboard con Discord</title><desc id="login-desc">Secuencia del inicio de sesión OAuth2: el navegador, Discord, la API y la base de datos intercambian un state de un solo uso y un código; el navegador solo recibe una cookie opaca, nunca los tokens de Discord.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#8a8a99"/></marker><marker id="arrow-acc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#c9caff"/></marker></defs><rect width="1100" height="768" fill="#0b0b0e"/>
<line x1="140" y1="112" x2="140" y2="660" stroke="#44445a" stroke-width="1" stroke-dasharray="3 4"/>
<line x1="420" y1="112" x2="420" y2="660" stroke="#44445a" stroke-width="1" stroke-dasharray="3 4"/>
<line x1="700" y1="112" x2="700" y2="660" stroke="#44445a" stroke-width="1" stroke-dasharray="3 4"/>
<line x1="960" y1="112" x2="960" y2="660" stroke="#44445a" stroke-width="1" stroke-dasharray="3 4"/>
<text x="40" y="696" font-family="'Instrument Serif',Georgia,'Times New Roman',serif" font-size="19" font-weight="400" fill="#b8b8c3" text-anchor="start" letter-spacing="0" font-style="italic">Los tokens de Discord se quedan en el servidor: el navegador solo guarda una cookie opaca.</text>
<line x1="32" y1="728" x2="1068" y2="728" stroke="#2b2b36" stroke-width="1"/>
<path d="M32 745 H56" stroke="#8a8a99" stroke-width="1.6"/>
