<rect x="478" y="142" width="165" height="22" rx="2" fill="#0b0b0e"/><text x="560.0" y="158" font-family="'Geist Mono','SF Mono',Consolas,'Liberation Mono',monospace" font-size="12" font-weight="400" fill="#8a8a99" text-anchor="middle" letter-spacing="0.6">GET /api/auth/start</text>
<rect x="717" y="185" width="226" height="23" rx="2" fill="#0b0b0e"/><text x="830.0" y="202" font-family="Geist,Inter,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#b8b8c3" text-anchor="middle" letter-spacing="0">guarda el state (HMAC, 10 min)</text>
<rect x="490" y="229" width="141" height="23" rx="2" fill="#0b0b0e"/><text x="560.0" y="246" font-family="Geist,Inter,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#b8b8c3" text-anchor="middle" letter-spacing="0">redirige a Discord</text>
<rect x="206" y="273" width="148" height="23" rx="2" fill="#0b0b0e"/><text x="280.0" y="290" font-family="Geist,Inter,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#b8b8c3" text-anchor="middle" letter-spacing="0">el usuario autoriza</text>
<rect x="192" y="317" width="176" height="23" rx="2" fill="#0b0b0e"/><text x="280.0" y="334" font-family="Geist,Inter,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#b8b8c3" text-anchor="middle" letter-spacing="0">vuelve con code y state</text>
<rect x="482" y="361" width="155" height="23" rx="2" fill="#0b0b0e"/><text x="560.0" y="378" font-family="Geist,Inter,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#b8b8c3" text-anchor="middle" letter-spacing="0">entrega code y state</text>
<rect x="717" y="405" width="226" height="23" rx="2" fill="#0b0b0e"/><text x="830.0" y="422" font-family="Geist,Inter,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#b8b8c3" text-anchor="middle" letter-spacing="0">consume el state (un solo uso)</text>
<rect x="184" y="449" width="191" height="23" rx="2" fill="#0b0b0e"/><text x="280.0" y="466" font-family="Geist,Inter,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#b8b8c3" text-anchor="middle" letter-spacing="0">cambia el code por tokens</text>
<rect x="532" y="493" width="55" height="23" rx="2" fill="#0b0b0e"/><text x="560.0" y="510" font-family="Geist,Inter,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#b8b8c3" text-anchor="middle" letter-spacing="0">tokens</text>
<rect x="699" y="537" width="262" height="23" rx="2" fill="#0b0b0e"/><text x="830.0" y="554" font-family="Geist,Inter,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#b8b8c3" text-anchor="middle" letter-spacing="0">guarda los tokens cifrados (Fernet)</text>
<rect x="468" y="581" width="184" height="23" rx="2" fill="#0b0b0e"/><text x="560.0" y="598" font-family="Geist,Inter,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="500" fill="#c9caff" text-anchor="middle" letter-spacing="0">cookie opaca, sin tokens</text>
<rect id="a-disc" x="40" y="48" width="200" height="64" rx="8" fill="#131318" stroke="#44445a" stroke-width="1.5"/><text x="56" y="76" font-family="Geist,Inter,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" font-weight="600" fill="#f2f2f5" text-anchor="start" letter-spacing="0" data-in="a-disc">Discord</text><text x="56" y="100" font-family="'Geist Mono','SF Mono',Consolas,'Liberation Mono',monospace" font-size="12" font-weight="400" fill="#8a8a99" text-anchor="start" letter-spacing="0" data-in="a-disc">OAuth2</text>
<rect id="a-nav" x="320" y="48" width="200" height="64" rx="8" fill="#131318" stroke="#44445a" stroke-width="1.5"/><text x="336" y="76" font-family="Geist,Inter,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" font-weight="600" fill="#f2f2f5" text-anchor="start" letter-spacing="0" data-in="a-nav">Navegador</text><text x="336" y="100" font-family="'Geist Mono','SF Mono',Consolas,'Liberation Mono',monospace" font-size="12" font-weight="400" fill="#8a8a99" text-anchor="start" letter-spacing="0" data-in="a-nav">dashboard</text>
<rect id="a-api" x="600" y="48" width="200" height="64" rx="8" fill="#171727" stroke="#c9caff" stroke-width="1.5"/><text x="616" y="76" font-family="Geist,Inter,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" font-weight="600" fill="#f2f2f5" text-anchor="start" letter-spacing="0" data-in="a-api">API Flask</text><text x="616" y="100" font-family="'Geist Mono','SF Mono',Consolas,'Liberation Mono',monospace" font-size="12" font-weight="400" fill="#8a8a99" text-anchor="start" letter-spacing="0" data-in="a-api">Render</text>
<rect id="a-db" x="860" y="48" width="200" height="64" rx="8" fill="#131318" stroke="#44445a" stroke-width="1.5"/><text x="876" y="76" font-family="Geist,Inter,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" font-weight="600" fill="#f2f2f5" text-anchor="start" letter-spacing="0" data-in="a-db">Supabase</text><text x="876" y="100" font-family="'Geist Mono','SF Mono',Consolas,'Liberation Mono',monospace" font-size="12" font-weight="400" fill="#8a8a99" text-anchor="start" letter-spacing="0" data-in="a-db">PostgreSQL</text>
