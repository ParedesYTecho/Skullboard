<path d="M152 745 H176" stroke="#8a8a99" stroke-width="1.6" stroke-dasharray="5 4"/>
<text x="184" y="749" font-family="'Geist Mono','SF Mono',Consolas,'Liberation Mono',monospace" font-size="12" font-weight="400" fill="#8a8a99" text-anchor="start" letter-spacing="0">Respuesta</text>
<path d="M279 745 H303" stroke="#c9caff" stroke-width="1.6"/>
