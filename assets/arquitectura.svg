<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="660" viewBox="0 0 1100 660" role="img" aria-labelledby="t d"><title id="t">Arquitectura de SkullBoard</title><desc id="d">Un proceso Python en Render con el bot y la API Flask, conectado a Discord y a Supabase, con la web estática servida por Vercel.</desc><rect width="1100" height="660" fill="#0b0b0e"/><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#7d7d8a"/></marker></defs><rect x="32" y="150" width="230" height="330" rx="14" fill="#131318" stroke="#26262f" stroke-width="1.5" stroke-dasharray="6 5"/><text x="52" y="180" font-family="Inter,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" font-weight="600" fill="#f2f2f5" text-anchor="start" letter-spacing="0">Discord</text><text x="52" y="214" font-family="Inter,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" font-weight="400" fill="#b8b8c3" text-anchor="start" letter-spacing="0">Gateway (WebSocket)</text><text x="52" y="236" font-family="Inter,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" font-weight="400" fill="#b8b8c3" text-anchor="start" letter-spacing="0">eventos de reacción</text><text x="52" y="258" font-family="Inter,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" font-weight="400" fill="#b8b8c3" text-anchor="start" letter-spacing="0">y borrado de mensajes</text><text x="52" y="280" font-family="Inter,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" font-weight="400" fill="#b8b8c3" text-anchor="start" letter-spacing="0"></text><text x="52" y="302" font-family="Inter,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" font-weight="400" fill="#b8b8c3" text-anchor="start" letter-spacing="0">API REST</text><text x="52" y="324" font-family="Inter,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" font-weight="400" fill="#b8b8c3" text-anchor="start" letter-spacing="0">mensajes, pins, DM,</text><text x="52" y="346" font-family="Inter,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" font-weight="400" fill="#b8b8c3" text-anchor="start" letter-spacing="0">permisos de canal</text><text x="52" y="368" font-family="Inter,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" font-weight="400" fill="#b8b8c3" text-anchor="start" letter-spacing="0"></text><text x="52" y="390" font-family="Inter,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" font-weight="400" fill="#b8b8c3" text-anchor="start" letter-spacing="0">OAuth2</text><text x="52" y="412" font-family="Inter,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" font-weight="400" fill="#b8b8c3" text-anchor="start" letter-spacing="0">identidad y servidores</text><text x="52" y="434" font-family="Inter,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" font-weight="400" fill="#b8b8c3" text-anchor="start" letter-spacing="0">del usuario</text><rect x="320" y="70" width="470" height="520" rx="18" fill="#0e0e12" stroke="#26262f" stroke-width="1.5" stroke-dasharray="6 5"/><text x="340" y="100" font-family="Inter,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" font-weight="600" fill="#f2f2f5" text-anchor="start" letter-spacing="0">Render · un solo proceso Python</text><rect x="344" y="124" width="422" height="218" rx="14" fill="#131318" stroke="#26262f" stroke-width="1.5"/><text x="364" y="154" font-family="Inter,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" font-weight="600" fill="#f2f2f5" text-anchor="start" letter-spacing="0">Bot  ·  hilo principal asyncio</text><text x="364" y="176" font-family="Inter,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" font-weight="400" fill="#b8b8c3" text-anchor="start" letter-spacing="0">discord.py, AutoShardedBot</text><text x="364" y="198" font-family="Inter,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" font-weight="400" fill="#b8b8c3" text-anchor="start" letter-spacing="0">Eventos raw de reacción y borrado</text><text x="364" y="220" font-family="Inter,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" font-weight="400" fill="#b8b8c3" text-anchor="start" letter-spacing="0">Debounce de 2 s por mensaje</text><text x="364" y="242" font-family="Inter,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" font-weight="400" fill="#b8b8c3" text-anchor="start" letter-spacing="0">Lock por mensaje y por servidor</text><text x="364" y="264" font-family="Inter,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" font-weight="400" fill="#b8b8c3" text-anchor="start" letter-spacing="0">Semáforo de borrado y límite global</text><text x="364" y="286" font-family="Inter,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" font-weight="400" fill="#b8b8c3" text-anchor="start" letter-spacing="0">de peticiones en /resync</text><text x="364" y="308" font-family="Inter,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" font-weight="400" fill="#b8b8c3" text-anchor="start" letter-spacing="0">Cachés con TTL para configuración</text><rect x="344" y="366" width="422" height="190" rx="14" fill="#131318" stroke="#26262f" stroke-width="1.5"/><text x="364" y="396" font-family="Inter,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" font-weight="600" fill="#f2f2f5" text-anchor="start" letter-spacing="0">API Flask  ·  hilo dedicado</text><text x="364" y="418" font-family="Inter,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" font-weight="400" fill="#b8b8c3" text-anchor="start" letter-spacing="0">OAuth2 del dashboard y sesiones</text><text x="364" y="440" font-family="Inter,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" font-weight="400" fill="#b8b8c3" text-anchor="start" letter-spacing="0">Rutas /api/guild/… con CSRF y origen</text><text x="364" y="462" font-family="Inter,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" font-weight="400" fill="#b8b8c3" text-anchor="start" letter-spacing="0">Estado del sistema y contacto</text><text x="364" y="484" font-family="Inter,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" font-weight="400" fill="#b8b8c3" text-anchor="start" letter-spacing="0">Cabeceras de seguridad</text><rect x="848" y="150" width="220" height="330" rx="14" fill="#131318" stroke="#26262f" stroke-width="1.5" stroke-dasharray="6 5"/><text x="868" y="180" font-family="Inter,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" font-weight="600" fill="#f2f2f5" text-anchor="start" letter-spacing="0">Supabase</text><text x="868" y="214" font-family="Inter,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" font-weight="400" fill="#b8b8c3" text-anchor="start" letter-spacing="0">PostgreSQL</text><text x="868" y="236" font-family="Inter,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" font-weight="400" fill="#b8b8c3" text-anchor="start" letter-spacing="0"></text><text x="868" y="258" font-family="Inter,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" font-weight="400" fill="#b8b8c3" text-anchor="start" letter-spacing="0">Configuración por servidor</text><text x="868" y="280" font-family="Inter,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" font-weight="400" fill="#b8b8c3" text-anchor="start" letter-spacing="0">Mensajes destacados</text><text x="868" y="302" font-family="Inter,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" font-weight="400" fill="#b8b8c3" text-anchor="start" letter-spacing="0">Sesiones cifradas del</text><text x="868" y="324" font-family="Inter,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" font-weight="400" fill="#b8b8c3" text-anchor="start" letter-spacing="0">dashboard y estados OAuth</text><text x="868" y="346" font-family="Inter,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" font-weight="400" fill="#b8b8c3" text-anchor="start" letter-spacing="0"></text><text x="868" y="368" font-family="Inter,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" font-weight="400" fill="#b8b8c3" text-anchor="start" letter-spacing="0">RLS activo: solo el</text><text x="868" y="390" font-family="Inter,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" font-weight="400" fill="#b8b8c3" text-anchor="start" letter-spacing="0">backend accede</text><rect x="32" y="520" width="230" height="110" rx="14" fill="#131318" stroke="#26262f" stroke-width="1.5"/><text x="52" y="550" font-family="Inter,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" font-weight="600" fill="#f2f2f5" text-anchor="start" letter-spacing="0">Vercel</text><text x="52" y="576" font-family="Inter,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" font-weight="400" fill="#b8b8c3" text-anchor="start" letter-spacing="0">Sirve la web al navegador</text><text x="52" y="598" font-family="Inter,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" font-weight="400" fill="#b8b8c3" text-anchor="start" letter-spacing="0">Reescribe /api al backend</text><path d="M262 215 L344 215" stroke="#7d7d8a" stroke-width="1.6" fill="none" marker-end="url(#ah)"/><text x="303" y="205" font-family="'JetBrains Mono','SF Mono',Consolas,monospace" font-size="12.5" font-weight="400" fill="#7d7d8a" text-anchor="middle" letter-spacing="0">eventos</text><path d="M344 300 L262 300" stroke="#7d7d8a" stroke-width="1.6" fill="none" marker-end="url(#ah)"/><text x="303" y="292" font-family="'JetBrains Mono','SF Mono',Consolas,monospace" font-size="12.5" font-weight="400" fill="#7d7d8a" text-anchor="middle" letter-spacing="0">REST</text><path d="M766 235 L848 235" stroke="#7d7d8a" stroke-width="1.6" fill="none" marker-end="url(#ah)"/><text x="807" y="225" font-family="'JetBrains Mono','SF Mono',Consolas,monospace" font-size="12.5" font-weight="400" fill="#7d7d8a" text-anchor="middle" letter-spacing="0">lectura/escritura</text><path d="M766 450 L848 430" stroke="#7d7d8a" stroke-width="1.6" fill="none" marker-end="url(#ah)"/><text x="807" y="430" font-family="'JetBrains Mono','SF Mono',Consolas,monospace" font-size="12.5" font-weight="400" fill="#7d7d8a" text-anchor="middle" letter-spacing="0">sesiones</text><path d="M344 410 L262 380" stroke="#7d7d8a" stroke-width="1.6" fill="none" marker-end="url(#ah)"/><text x="303" y="380" font-family="'JetBrains Mono','SF Mono',Consolas,monospace" font-size="12.5" font-weight="400" fill="#7d7d8a" text-anchor="middle" letter-spacing="0">OAuth</text><path d="M262 580 L344 520" stroke="#7d7d8a" stroke-width="1.6" fill="none" marker-end="url(#ah)"/><text x="303" y="558" font-family="'JetBrains Mono','SF Mono',Consolas,monospace" font-size="12.5" font-weight="400" fill="#7d7d8a" text-anchor="middle" letter-spacing="0">/api</text></svg>
